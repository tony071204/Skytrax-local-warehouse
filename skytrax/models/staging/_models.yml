version: 2

models:
  - name: stg__airlines
    description: "One row per airline. Dimension table, join key for all review tables."
    columns:
      - name: airline_id
        description: "Primary key, numeric identifier of the airline."
        tests:
          - unique
          - not_null
      - name: airline_name
        description: "Display name of the airline."
        tests:
          - not_null

  - name: stg__airports
    description: "One row per airport. Dimension table, join key for raw_airport_reviews."
    columns:
      - name: airport_id
        description: "Primary key, numeric identifier of the airport."
        tests:
          - unique
          - not_null
      - name: airport_name
        description: "Display name of the airport."
        tests:
          - not_null
  - name: stg__lounge_reviews
    description: "One row per lounge review"
    columns:
      - name: review_id
        description: "Primary key of the review."
        tests:
          - unique
          - not_null
      - name: airline_id
        description: "Airline the lounge belongs to."
        tests:
          - not_null
          - relationships:
              to: ref('stg__airlines')
              field: airline_id
      - name: lounge_name
        description: "lounge name"
      - name: airport_name
        description: "Airport of the lounge"
      - name: type_of_lounge
        description: "Lounge category"
        tests:
          - accepted_values:
              values: ['Business Class', 'First Class', 'Frequent Flyer', 'Members', 'Pay to Use']
      - name: nationality
        description: "Reviewer country"
        tests:
          - relationships:
              to: ref('countries')
              field: country_name

  - name: stg__seat_reviews
    description: "One row per seat review"
    columns:
      - name: review_id
        description: "Primary key of the review."
        tests:
          - unique
          - not_null
      - name: airline_id
        description: "Airline of the review."
        tests:
          - not_null
          - relationships:
              to: ref('stg__airlines')
              field: airline_id
      - name: seat_type
        description: "Cabin class"
        tests:
          - accepted_values:
              values: ['Economy Class', 'Premium Economy', 'Business Class', 'First Class', 'World Traveller Plus']
      - name: type_of_traveller
        description: "Traveller segment"
        tests:
          - accepted_values:
              values: ['Solo Leisure', 'Couple Leisure', 'Family Leisure', 'Business', 'Leisure']
      - name: seat_layout
        description: "Normalised layout such as 3x3 or 2x4x2"
      - name: nationality
        description: "Reviewer country"
        tests:
          - relationships:
              to: ref('countries')
              field: country_name

  - name: stg__airport_reviews
    description: "One row per airport review"
    columns:
      - name: review_id
        description: "Primary key of the review"
        tests:
          - unique
          - not_null
      - name: airport_id
        description: "Airport of the review"
        tests:
          - not_null
          - relationships:
              to: ref('stg__airports')
              field: airport_id
      - name: experience_at_airport
        description: "Which part of the journey the review covers"
        tests:
          - accepted_values:
              values: ['Departure Only', 'Arrival and Departure', 'Transit', 'Arrival Only']
      - name: type_of_traveller
        description: "Traveller segment"
        tests:
          - accepted_values:
              values: ['Solo Leisure', 'Couple Leisure', 'Family Leisure', 'Business']
      - name: nationality
        description: "Reviewer country"
        tests:
          - relationships:
              to: ref('countries')
              field: country_name
  - name: stg__airline_reviews
    description: "One row per airline review after removing the 'Read more' pseudo-airline, identical duplicates, junk cities and non-country nationalities."
    columns:
      - name: review_id
        description: "Primary key of the review."
        tests:
          - unique
          - not_null
      - name: airline_id
        description: "Airline of the review."
        tests:
          - not_null
          - relationships:
              to: ref('stg__airlines')
              field: airline_id
      - name: seat_type
        description: "Cabin class."
        tests:
          - accepted_values:
              values: ['Economy Class', 'Premium Economy', 'Business Class', 'First Class']
      - name: type_of_traveller
        description: "Traveller segment."
        tests:
          - accepted_values:
              values: ['Solo Leisure', 'Couple Leisure', 'Family Leisure', 'Business']
      - name: nationality
        description: "Reviewer country, null when the value is not in the countries seed."
        tests:
          - relationships:
              to: ref('countries')
              field: country_name